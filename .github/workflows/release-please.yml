name: Release Please

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to NuGet (for example, v0.1.0)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  publish:
    needs:
      - release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    # The AvaloniaEdit preview of nuget.config: GitHub Packages needs a token even for public packages, and this
    # repository's own token can't read another repository's packages.
    env:
      NuGetPackageSourceCredentials_AvaloniaEditPreview: Username=x;Password=${{ secrets.AVALONIAEDIT_PACKAGES_TOKEN }}
    permissions:
      contents: read
      # Trusted publishing: nuget.org exchanges the workflow's OIDC token for a short-lived API key
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Pack packages
        run: dotnet pack -c Release -o ./artifacts

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes each package's .snupkg symbol package with it
      - name: Push packages to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
