name: Preview packages

# pull_request_target runs this workflow as it is on main, so a pull request cannot change what runs with the
# package token, and the workflow only takes effect once it is merged. The build job checks out the pull request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    # Only branches of this repository publish previews; code from forks and Dependabot does not.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      packages: ${{ steps.verify.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      # A prerelease of the patch after the last release: it sorts above that release and below the next one.
      - name: Choose prerelease version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          released=$(dotnet msbuild Directory.Build.props -getProperty:Version)
          if [[ ! "$released" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Cannot read the released version from Directory.Build.props: $released"
            exit 1
          fi
          base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          suffix=${PR_NUMBER:+pr.$PR_NUMBER}
          echo "version=$base-${suffix:-preview}.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # Packs every packable project: the libraries under src/ (see Directory.Build.targets).
      - name: Pack packages
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack -c Release -o artifacts/preview "-p:Version=$PREVIEW_VERSION"

      - name: Verify preview packages
        id: verify
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(artifacts/preview/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No packages were created"
            exit 1
          fi
          ids=()
          for package in "${packages[@]}"; do
            nuspec=$(unzip -p "$package" '*.nuspec')
            id=$(sed -n 's:.*<id>\(.*\)</id>.*:\1:p' <<< "$nuspec")
            version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' <<< "$nuspec")
            if [ "$version" != "$PREVIEW_VERSION" ]; then
              echo "::error::$id has version $version instead of $PREVIEW_VERSION"
              exit 1
            fi
            ids+=("$id")
          done
          echo "packages=$(IFS=,; echo "${ids[*]}")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: preview-packages
          path: artifacts/preview/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: preview-packages
          path: packages

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: dotnet nuget push 'packages/*.nupkg' --source "$FEED_URL" --api-key "$GH_TOKEN" --skip-duplicate

      - name: Record package details
        env:
          PREVIEW_VERSION: ${{ needs.build.outputs.version }}
          PACKAGES: ${{ needs.build.outputs.packages }}
          FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: |
          {
            echo '## Preview NuGet packages'
            echo
            echo "Version: \`$PREVIEW_VERSION\`"
            echo
            echo "Feed: $FEED_URL"
            echo
            tr ',' '\n' <<< "$PACKAGES" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  comment:
    if: github.event_name == 'pull_request_target'
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Update preview package comment
        uses: actions/github-script@v9.0.0
        env:
          PREVIEW_VERSION: ${{ needs.build.outputs.version }}
          PACKAGES: ${{ needs.build.outputs.packages }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- preview-packages -->';
            const version = process.env.PREVIEW_VERSION;
            const packages = process.env.PACKAGES.split(',');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Preview NuGet packages',
              '',
              `Published **${version}** for commit ${process.env.HEAD_SHA}.`,
              '',
              `Feed: https://nuget.pkg.github.com/${context.repo.owner}/index.json`,
              '',
              '```powershell',
              ...packages.map(id => `dotnet add package ${id} --version ${version}`),
              '```',
              '',
              'The feed requires a GitHub token with read:packages access.',
              '',
              `[Build and downloadable packages](${runUrl}) · [Feed setup](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/docs/packages.md)`
            ].join('\n');
            const params = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }
