name: Benchmark

# Runs for every pull request, whatever its target branch, so that each layer of a stack is compared with its parent.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare against target branch
    runs-on: ubuntu-24.04
    # The AvaloniaEdit preview of nuget.config: GitHub Packages needs a token even for public packages, and this
    # repository's own token can't read another repository's packages.
    env:
      DARP_CODEEDITOR_BASELINE_VERSION: 0.0.0-baseline
      NuGetPackageSourceCredentials_AvaloniaEditPreview: Username=x;Password=${{ secrets.AVALONIAEDIT_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tmp/benchmark-baseline
      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      # Into the benchmark-baseline source of nuget.config. The target branch is packed outside this checkout, so that
      # it builds with its own nuget.config and build files, not with this pull request's, which NuGet and MSBuild find
      # in parent folders. Outside, BenchmarkDotNet also doesn't find the target branch's copy of the benchmark project.
      - name: Pack target branch as baseline
        run: |
          mv tmp/benchmark-baseline "$RUNNER_TEMP/benchmark-baseline"
          dotnet pack "$RUNNER_TEMP/benchmark-baseline/src/Darp.CodeEditor/Darp.CodeEditor.csproj" -c Release \
            -o artifacts/benchmark-baseline -p:Version="$DARP_CODEEDITOR_BASELINE_VERSION"

      # Only the benchmarks of the CI category, which track the budgets and the hot paths; the others run locally. Both
      # versions are measured in one run on the same machine, so that differences between runners cancel out.
      - name: Run benchmarks
        run: dotnet run -c Release --project benchmarks/Darp.CodeEditor.Benchmarks -- --anyCategories CI --join

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.base_ref }}
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          marker='<!-- darp-codeeditor-benchmark-report -->'
          results=BenchmarkDotNet.Artifacts/results
          # The base branch as the pull request names it now: on a pull request stacked on another one's branch, which
          # the baseline comes from, github.base_ref has read main.
          target=$(gh pr view "$PULL_REQUEST" --repo "$REPOSITORY" --json baseRefName --jq .baseRefName) \
            || target=$TARGET_BRANCH
          {
            echo "$marker"
            echo "## Benchmark: this pull request against \`$target\` at \`${BASELINE_SHA:0:7}\`"
            echo
            cat $results/*-report-comparison.md
            echo
            if grep -q "Benchmarks with issues" $results/*-report-github.md; then
              echo "> The target branch could not be measured with this pull request's benchmarks, most likely because it lacks members they use."
              echo
            fi
            echo "<details><summary>Full BenchmarkDotNet report</summary>"
            echo
            cat $results/*-report-github.md
            echo
            echo "</details>"
          } > benchmark-report.md
          cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

          # Pull requests from forks get a read-only token; the step summary is the report then.
          comment_id=$(gh api "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -F body=@benchmark-report.md > /dev/null \
              || echo "::warning::Could not update the benchmark comment."
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -F body=@benchmark-report.md > /dev/null \
              || echo "::warning::Could not create the benchmark comment."
          fi
